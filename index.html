    canvas.style.width  = Math.floor(sh * ratio) + "px";

    canvas.style.width  = sw + "px";

// ─── 音效系统 (Web Audio API) ─────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function playTone(freq, duration, type, vol, delay) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || "square";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime((vol || 0.15) * settings.volume, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function playNoise(duration, vol, delay) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + (delay || 0);
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime((vol || 0.1) * settings.volume, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  src.connect(gain).connect(audioCtx.destination);
  src.start(t);
}

  start() {
    if (this.playing || !audioCtx) return;
    this.playing = true;
    this._playTrack(this.trackIndex);

  _playTrack(idx) {
    if (!this.playing) return;
    const track = this.tracks[idx % this.tracks.length];
    let mi = 0, bi = 0;

    const tick = () => {
      if (!this.playing) return;
      const now = audioCtx.currentTime;

      // 主旋律
      const [mFreq, mDur] = track.melody[mi % track.melody.length];
      if (mFreq > 0) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(mFreq, now);
        gain.gain.setValueAtTime(0.06 * settings.volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + mDur * 0.9);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + mDur);
      }

      // 低音伴奏
      const [bFreq, bDur] = track.bass[bi % track.bass.length];
      if (bFreq > 0) {
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = "triangle";
        osc2.frequency.setValueAtTime(bFreq, now);
        gain2.gain.setValueAtTime(0.04 * settings.volume, now);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + bDur * 0.9);
        osc2.connect(gain2).connect(audioCtx.destination);
        osc2.start(now);
        osc2.stop(now + bDur);
      }

      const step = Math.min(track.melody[mi % track.melody.length][1], track.bass[bi % track.bass.length][1]);
      mi++; bi++;

      // 一首播完 → 切下一首
      if (mi >= track.melody.length) {
        this.trackIndex = (idx + 1) % this.tracks.length;
        this.timer = setTimeout(() => this._playTrack(this.trackIndex), step * 1000);
      } else {
        this.timer = setTimeout(tick, step * 1000);
      }
    };
    tick();
  },

  stop() {
    this.playing = false;
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
  },
};

// ─── 碰撞检测工具 ────────────────────────────────────────────
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// 判断瓦片是否实心
function solid(r, c) {
  if (r < 0 || c < 0 || c >= COLS) return false;
  if (r >= ROWS) return false;   // 坑道：地图下方不是实心，让玩家掉下去
  const t = LEVEL[r][c];
  return t === 1 || t === 2 || t === 3 || t === 4 || t === 5 || t === 6 || t === 8 || t === 9;
}

// 与地图的碰撞（通用，处理水平 + 垂直）
function collideMapX(obj) {
  const top    = Math.floor(obj.y / TILE);
  const bottom = Math.floor((obj.y + obj.h - 1) / TILE);
  if (obj.vx > 0) {
    const col = Math.floor((obj.x + obj.w) / TILE);
    for (let r = top; r <= bottom; r++) {
      if (solid(r, col)) { obj.x = col * TILE - obj.w; obj.vx = 0; return true; }
    }
  } else if (obj.vx < 0) {
    const col = Math.floor(obj.x / TILE);
    for (let r = top; r <= bottom; r++) {
      if (solid(r, col)) { obj.x = (col + 1) * TILE; obj.vx = 0; return true; }
    }
  }
  return false;
}

function collideMapY(obj, isPlayer) {
  const left  = Math.floor((obj.x + 3) / TILE);
  const right = Math.floor((obj.x + obj.w - 4) / TILE);
  obj.onGround = false;
  if (obj.vy > 0) {
    const row = Math.floor((obj.y + obj.h) / TILE);
    // 确保是从上方落入（之前底部在该行上方）
    const prevBottom = obj.y + obj.h - obj.vy;
    if (Math.floor(prevBottom / TILE) < row) return null;
    for (let c = left; c <= right; c++) {
      if (solid(row, c)) {
        obj.y = row * TILE - obj.h;
        obj.vy = 0; obj.onGround = true; return "floor";
      }
    }
  } else if (obj.vy < 0 && isPlayer) {
    const row = Math.floor(obj.y / TILE);
    for (let c = left; c <= right; c++) {
      if (solid(row, c)) {
        obj.y = (row + 1) * TILE;
        obj.vy = 0;
        hitBlock(row, c);
        return "ceil";
      }
    }
  }
  return null;
}

// ─── 顶方块 ──────────────────────────────────────────────────
function hitBlock(row, col) {
  const t = LEVEL[row][col];
  SFX.bump();
  if (t === 3) { // 问号 → 蘑菇
    LEVEL[row][col] = 2; // 变砖块
    spawnMushroom(col * TILE, (row - 1) * TILE, col === 23);
    if (col === 23) firstQHit = true;
    bumpAnim(row, col);
  } else if (t === 4) { // 问号 → 金币
    LEVEL[row][col] = 2;
    addCoin();
    coinAnims.push({ x: col * TILE + 8, y: row * TILE - TILE, vy: -8, timer: 30 });
    bumpAnim(row, col);
  } else if (t === 8) { // 问号 → 无敌星
    LEVEL[row][col] = 2;
    spawnStar(col * TILE, (row - 1) * TILE);
    bumpAnim(row, col);
  } else if (t === 2 && player.big) {
    // 大马里奥顶碎砖块
    LEVEL[row][col] = 0;
    addScore(50);
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: col * TILE + (i % 2) * 16, y: row * TILE + Math.floor(i / 2) * 16,
        vx: (i % 2 === 0 ? -2 : 2) + Math.random(), vy: -6 - Math.random() * 3,
        life: 40, type: "debris"
      });
    }
  }
}

function update() {

        keys["Escape"] = false;
        nameInputMode = false;
        nameBox.blur();
        customName = "小丑";
        nameBox.value = "";
        CHARACTERS[4].name = customName;
        saveData();
      }
      return;
    }

    // ── 主菜单 ──
    if (menuScreen === "main") {
      // 确保隐藏输入框不抢焦点
      document.getElementById("regIdInput").blur();
      document.getElementById("regNameInput").blur();
      document.getElementById("nameInput").blur();
      if (keys["ArrowUp"] || keys["KeyW"]) { menuBtn = (menuBtn + 3) % 4; keys["ArrowUp"] = false; keys["KeyW"] = false; }
      if (keys["ArrowDown"] || keys["KeyS"]) { menuBtn = (menuBtn + 1) % 4; keys["ArrowDown"] = false; keys["KeyS"] = false; }
      if (keys["Enter"]) {
        keys["Enter"] = false;
        if (menuBtn === 0) menuScreen = "characters";
        else if (menuBtn === 1) menuScreen = "levels";
        else if (menuBtn === 2) { menuScreen = "leaderboard"; lbTab = 0; lbData = []; }
        else if (menuBtn === 3) menuScreen = "settings";
      }
      if (keys["Space"]) {
        keys["Space"] = false;
        CHARACTERS[4].name = customName || "小丑";
        menuScreen = "main";
        levelAttempts = 0;
        init();
        BGM.start();
      }
      // Tab 键打开注册界面（未注册时）
      if (keys["Tab"] && !playerSession) {
        keys["Tab"] = false;
        menuScreen = "register";
        regField = 0;
        regIdText = "";
        regNameText = "";
        document.getElementById("regIdInput").focus();
      }
      return;
    }

    // ── 角色选择 ──
    if (menuScreen === "characters") {
      if (keys["ArrowLeft"] || keys["KeyA"]) { charIndex = (charIndex + CHARACTERS.length - 1) % CHARACTERS.length; keys["ArrowLeft"] = false; keys["KeyA"] = false; saveData(); }
      if (keys["ArrowRight"] || keys["KeyD"]) { charIndex = (charIndex + 1) % CHARACTERS.length; keys["ArrowRight"] = false; keys["KeyD"] = false; saveData(); }
      if (keys["Enter"]) {
        keys["Enter"] = false;
        if (charIndex === 4) {
          nameInputMode = true;
          customName = "";
          nameBox.value = "";
          nameBox.focus();
          return;
        }
      }
      if (keys["Escape"]) { keys["Escape"] = false; menuScreen = "main"; }
      return;
    }

    // ── 关卡选择 ──
    if (menuScreen === "levels") {
      if (keys["ArrowUp"] || keys["KeyW"]) { levelIndex = (levelIndex + LEVELS.length - 1) % LEVELS.length; keys["ArrowUp"] = false; keys["KeyW"] = false; }
      if (keys["ArrowDown"] || keys["KeyS"]) { levelIndex = (levelIndex + 1) % LEVELS.length; keys["ArrowDown"] = false; keys["KeyS"] = false; }
      if (keys["Escape"] || keys["Enter"]) { keys["Escape"] = false; keys["Enter"] = false; menuScreen = "main"; }
      return;
    }

    // ── 设置 ──
    if (menuScreen === "settings") {
      if (keys["ArrowUp"] || keys["KeyW"]) { settingsSel = (settingsSel + 2) % 3; keys["ArrowUp"] = false; keys["KeyW"] = false; }
      if (keys["ArrowDown"] || keys["KeyS"]) { settingsSel = (settingsSel + 1) % 3; keys["ArrowDown"] = false; keys["KeyS"] = false; }
      if (keys["ArrowLeft"] || keys["KeyA"]) {
        if (settingsSel === 0) settings.brightness = Math.max(0.3, +(settings.brightness - 0.1).toFixed(1));
        if (settingsSel === 1) settings.volume = Math.max(0, +(settings.volume - 0.1).toFixed(1));
        if (settingsSel === 2) settings.speed = Math.max(0.5, +(settings.speed - 0.1).toFixed(1));
        keys["ArrowLeft"] = false; keys["KeyA"] = false;
        saveData();
      }
      if (keys["ArrowRight"] || keys["KeyD"]) {
        if (settingsSel === 0) settings.brightness = Math.min(1.0, +(settings.brightness + 0.1).toFixed(1));
        if (settingsSel === 1) settings.volume = Math.min(1.0, +(settings.volume + 0.1).toFixed(1));
        if (settingsSel === 2) settings.speed = Math.min(1.5, +(settings.speed + 0.1).toFixed(1));
        keys["ArrowRight"] = false; keys["KeyD"] = false;
        saveData();
      }
      if (keys["Escape"] || keys["Enter"]) { keys["Escape"] = false; keys["Enter"] = false; menuScreen = "main"; }
      return;
    }

    // ── 注册界面 ──
    if (menuScreen === "register") {
      const idBox = document.getElementById("regIdInput");
      const nameBox = document.getElementById("regNameInput");
      if (regField === 0) {
        regIdText = idBox.value;
        if (keys["Enter"] || keys["Tab"]) {
          keys["Enter"] = false; keys["Tab"] = false;
          if (regIdText.trim().length === 0) { regMsg = "请输入ID"; regMsgTimer = 120; }
          else { regField = 1; nameBox.focus(); idBox.blur(); }
        }
      } else {
        regNameText = nameBox.value;
        if (keys["Enter"]) {
          keys["Enter"] = false;
          if (regNameText.trim().length === 0) { regMsg = "请输入姓名"; regMsgTimer = 120; }
          else {
            (async () => {
              const r = await registerPlayer(regIdText.trim(), regNameText.trim());
              if (r.ok) { regMsg = r.isNew ? "注册成功!" : "登录成功!"; menuScreen = "main"; idBox.value = ""; nameBox.value = ""; regField = 0; startHeartbeat(); }
              else { regMsg = r.msg || "注册失败"; }
              regMsgTimer = 120;
            })();
          }
        }
      }
      if (keys["Escape"]) {
        keys["Escape"] = false;
        menuScreen = "main"; regField = 0;
        idBox.blur(); nameBox.blur();
      }
      if (regMsgTimer > 0) regMsgTimer--;
      return;
    }

    // ── 排行榜界面 ──
    if (menuScreen === "leaderboard") {
      if (keys["ArrowLeft"] || keys["KeyA"]) { lbTab = (lbTab + LEVELS.length - 1) % LEVELS.length; keys["ArrowLeft"] = false; keys["KeyA"] = false; lbData = []; }
      if (keys["ArrowRight"] || keys["KeyD"]) { lbTab = (lbTab + 1) % LEVELS.length; keys["ArrowRight"] = false; keys["KeyD"] = false; lbData = []; }
      if (keys["Escape"] || keys["Enter"]) { keys["Escape"] = false; keys["Enter"] = false; menuScreen = "main"; }
      // 加载数据
      if (lbData.length === 0 && !lbLoading) {
        lbLoading = true;
        fetchLeaderboard(lbTab).then(d => { lbData = d; lbLoading = false; });
      }
      return;
    }

    return;
  }
  if (gameState === "dead") {
    if (keys["Escape"]) {
      keys["Escape"] = false;
      gameState = "ready";
      menuScreen = "main";
      BGM.stop();
      return;
    }
    deathTimer--;
    player.vy += GRAVITY;
    player.y += player.vy;
    if (deathTimer <= 0) {
      attempts++;
      attemptEl.textContent = "ATTEMPTS: " + attempts;
      saveData();
      if (sb && playerSession) {
        sb.from('players').update({ total_attempts: attempts }).eq('player_id', playerSession.player_id)
          .then(r => console.log('同步attempts:', attempts, r))
          .catch(e => console.error('同步失败:', e));
      }
      gameState = "deathwait";
    }
    return;
  }
  if (gameState === "deathwait") {
    if (keys["Escape"]) {
      keys["Escape"] = false;
      gameState = "ready";
      menuScreen = "main";
      BGM.stop();
      return;
    }
    if (keys["KeyR"]) {
      keys["KeyR"] = false;
      levelAttempts++;
      attempts++;
      attemptEl.textContent = "ATTEMPTS: " + attempts;
      saveData();
      if (sb && playerSession) {
        sb.from('players').update({ total_attempts: attempts }).eq('player_id', playerSession.player_id);
      }
      loadLevel(levelIndex);
      resetPlayer();
      cameraX = 0;
      firstQHit = false;
      starTimer = 0;
      spawnEnemies();
      spawnPlants();
      spawnClouds();
      spawnChaser();
      items = []; particles = []; coinAnims = [];
      gameState = "playing";
      BGM.start();
    }
    return;
  }
  if (gameState === "gameover" || gameState === "win") {
    // ESC 返回主菜单
    if (keys["Escape"]) {
      keys["Escape"] = false;
      gameState = "ready";
      menuScreen = "main";
      BGM.stop();
    }
    return;
  }

  // ─ ESC 暂停游戏
  if (keys["Escape"]) {
    keys["Escape"] = false;
    gameState = "paused";
    pauseSel = 0;
    return;
  }
  if (gameState === "paused") {
    if (keys["ArrowUp"] || keys["KeyW"]) { pauseSel = (pauseSel + 1) % 2; keys["ArrowUp"] = false; keys["KeyW"] = false; }
    if (keys["ArrowDown"] || keys["KeyS"]) { pauseSel = (pauseSel + 1) % 2; keys["ArrowDown"] = false; keys["KeyS"] = false; }
    if (keys["Enter"] || keys["Space"]) {
      keys["Enter"] = false; keys["Space"] = false;
      if (pauseSel === 0) { gameState = "playing"; } // 继续
      else { gameState = "ready"; menuScreen = "main"; BGM.stop(); } // 返回菜单
    }
    if (keys["Escape"]) { keys["Escape"] = false; gameState = "playing"; } // ESC 也继续
    return;
  }

  const p = player;

  // ─ F1 切换创造模式
  if (keys["F1"]) {
    keys["F1"] = false;
    creativeMode = !creativeMode;
    if (!creativeMode) flying = false;
  }

  // ─ 双击空格切换飞行（创造模式下）
  if (creativeMode && keys["Space"]) {
    keys["Space"] = false;
    const now = Date.now();
    if (now - lastSpaceTap < 300) {
      flying = !flying;
      p.vy = 0;
    }
    lastSpaceTap = now;
  }

  // ─ 创造模式：永远无敌
  if (creativeMode) p.invincible = 2;

  // ─ 玩家无敌闪烁
  if (p.invincible > 0) p.invincible--;
  // ─ 无敌星倒计时
  if (starTimer > 0) starTimer--;

  // ─ 水平移动
  p.vx = 0;
  const spd = MOVE_SPD * settings.speed * (creativeMode && flying ? 1.8 : 1);
  if (keys["ArrowLeft"]  || keys["KeyA"]) { p.vx = -spd; p.dir = -1; }
  if (keys["ArrowRight"] || keys["KeyD"]) { p.vx =  spd; p.dir =  1; }

  if (flying) {
    // ─ 飞行模式：方向键控制上下
    p.vy = 0;
    if (keys["ArrowUp"]   || keys["KeyW"]) p.vy = -spd * 1.5;
    if (keys["ArrowDown"] || keys["KeyS"]) p.vy =  spd * 1.5;
    p.onGround = false;
  } else {
    // ─ 跳跃
    if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && p.onGround) {
      p.vy = JUMP_VEL;
      p.onGround = false;
      SFX.jump();
    }
    // ─ 重力
    p.vy += GRAVITY;
    if (p.vy > MAX_FALL) p.vy = MAX_FALL;
  }

  // ─ 动画
  if (Math.abs(p.vx) > 0.1) {
    p.animTimer++;
    if (p.animTimer > 6) { p.animTimer = 0; p.animFrame = (p.animFrame + 1) % 3; }
  } else {
    p.animFrame = 0;
  }

  // ─ 移动 & 碰撞
  p.x += p.vx;
  if (p.x < 0) p.x = 0;
  if (!flying) {
    collideMapX(p);
    // 隐形墙：没顶第一个问号就过不去（创造模式跳过）
    if (!creativeMode && WALL_COL > 0 && !firstQHit && p.x + p.w > WALL_COL * TILE) {
      p.x = WALL_COL * TILE - p.w;
      p.vx = 0;
    }
  }
  p.y += p.vy;
  if (!flying) collideMapY(p, true);

  // ─ 掉出地图（创造模式不死）
  if (p.y > H + 50) { if (creativeMode) { p.y = 0; p.vy = 0; } else { playerDie(); return; } }

  // ─ 到达旗杆
  if (p.x + p.w >= FLAG_X && p.x <= FLAG_X + TILE) {
    gameState = "win";
    winTimer = 180;
    levelAttempts++;
    const finalTime = (Date.now() - levelStartTime) / 1000; // 秒
    addScore(5000);
    SFX.win();
    // 提交成绩到排行榜（时间）
    submitLevelScore(levelIndex, levelAttempts, finalTime);
    return;
  }

  // ─ 镜头跟随
  const targetCam = p.x - W / 2 + p.w / 2;
  cameraX += (targetCam - cameraX) * 0.12;
  if (cameraX < 0) cameraX = 0;
  const maxCam = COLS * TILE - W;
  if (cameraX > maxCam) cameraX = maxCam;

  // ─ 敌人更新
  for (const e of enemies) {
    if (!e.alive) { e.squishTimer--; continue; }
    const dist = e.x - cameraX;
    // 还没进入可视范围的敌人完全冻结
    if (dist > W + 64 || dist < -W * 0.5) continue;
    e.vy += GRAVITY;
    if (e.vy > MAX_FALL) e.vy = MAX_FALL;
    if (e.y > H + 50) { e.alive = false; e.squishTimer = 0; continue; }
    e.x += e.vx;
    // 水平碰墙反转
    {
      const top = Math.floor(e.y / TILE);
      const bot = Math.floor((e.y + e.h - 1) / TILE);
      if (e.vx > 0) {
        const c = Math.floor((e.x + e.w) / TILE);
        for (let r = top; r <= bot; r++) { if (solid(r, c)) { e.x = c * TILE - e.w; e.vx *= -1; break; } }
      } else {
        const c = Math.floor(e.x / TILE);
        for (let r = top; r <= bot; r++) { if (solid(r, c)) { e.x = (c + 1) * TILE; e.vx *= -1; break; } }
      }
    }
    e.y += e.vy;
    {
      const left = Math.floor((e.x + 2) / TILE);
      const right = Math.floor((e.x + e.w - 3) / TILE);
      e.onGround = false;
      if (e.vy > 0) {
        const row = Math.floor((e.y + e.h) / TILE);
        for (let c = left; c <= right; c++) { if (solid(row, c)) { e.y = row * TILE - e.h; e.vy = 0; e.onGround = true; break; } }
      }
    }
  }
  // ─ 板栗仔融合：两个相遇 → 合体成大型板栗仔
  {
    const alive = enemies.filter(e => e.alive);
    for (let i = 0; i < alive.length; i++) {
      for (let j = i + 1; j < alive.length; j++) {
        const a = alive[i], b = alive[j];
        if (a.big || b.big) continue; // 已经大的不再融合
        if (aabb(a, b)) {
          // 合体：在中点生成大型板栗仔
          const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          a.alive = false; b.alive = false;
          enemies.push({
            x: mx, y: my - 28,
            w: 56, h: 56,
            vx: -ENEMY_SPD * 0.7, vy: 0,
            alive: true, squishTimer: 0, big: true,
          });
          particles.push({ x: mx + 14, y: my - 40, text: "FUSE!", life: 40, type: "text" });
          SFX.fuse();
          break; // 每帧只融合一次
        }
      }
      if (!alive[i].alive) break;
    }
  }
  // 移除销毁的敌人
  enemies = enemies.filter(e => e.alive || e.squishTimer > 0);

  // ─ 玩家 vs 敌人碰撞
  for (const e of enemies) {
    if (!e.alive) continue;
    if (!aabb(p, e)) continue;
    // 无敌星状态：碰到就杀
    if (starTimer > 0) {
      e.alive = false;
      e.squishTimer = 20;
      addScore(e.big ? 500 : 200);
      SFX.stomp();
      particles.push({ x: e.x, y: e.y - 10, text: e.big ? "500" : "200", life: 40, type: "text" });
      continue;
    }
    if (p.invincible > 0) continue;
    if (e.big) {
      playerDie();
      continue;
    }
    // 判断是从上方踩
    const pBottom = p.y + p.h;
    const eTop    = e.y + 6;
    if (p.vy > 0 && pBottom - eTop < 14) {
      e.alive = false;
      e.squishTimer = 20;
      p.vy = -8;
      addScore(100);
      SFX.stomp();
      particles.push({ x: e.x, y: e.y - 10, text: "100", life: 40, type: "text" });
    } else {
      playerHit();
    }
  }

  // ─ 食人花更新
  for (const pl of plants) {
    const dist = pl.x - cameraX;
    if (dist > W + 100 || dist < -100) continue; // 屏幕外跳过
    pl.timer--;
    switch (pl.state) {
      case "hide":
        pl.y = pl.hideY;
        if (pl.timer <= 0) { pl.state = "rise"; pl.timer = 90; }
        break;
      case "rise":
        pl.y += (pl.showY - pl.hideY) / 90;
        if (pl.timer <= 0) { pl.state = "show"; pl.timer = 110; pl.y = pl.showY; }
        break;
      case "show":
        pl.y = pl.showY;
        if (pl.timer <= 0) { pl.state = "descend"; pl.timer = 90; }
        break;
      case "descend":
        pl.y += (pl.hideY - pl.showY) / 90;
        if (pl.timer <= 0) { pl.state = "hide"; pl.timer = 150 + Math.random() * 80; pl.y = pl.hideY; }
        break;
    }
    // 食人花 vs 玩家碰撞
    if (pl.state === "show" || pl.state === "rise" || pl.state === "descend") {
      const plantBox = { x: pl.x, y: pl.y, w: pl.w, h: pl.h };
      if (aabb(p, plantBox)) {
        if (starTimer > 0) {
          // 无敌星状态下消灭食人花
          pl.state = "hide"; pl.timer = 180;
          addScore(300);
          SFX.stomp();
          particles.push({ x: pl.x, y: pl.y - 10, text: "300", life: 40, type: "text" });
        } else if (p.invincible <= 0) {
          playerHit();
        }
      }
    }
  }

  // ─ 追逐者更新
  if (chaser) {
    // ── 追逐逻辑（两关通用）──
    const dx = p.x - chaser.x;
    const dy = p.y - chaser.y;
    chaser.dir = dx > 0 ? 1 : -1;

    if (chaser.state === "wait") {
      chaser.waitTimer--;
      chaserSpeechTimer--;
      if (chaserSpeechTimer <= 120) chaserSpeech = "";
      if (chaser.waitTimer <= 0) {
        chaser.state = "chase";
        chaserSpeechTimer = 300 + Math.floor(Math.random() * 120);
      }
    } else {
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 1) {
        chaser.x += (dx / dist) * CHASER_SPEED;
        chaser.y += (dy / dist) * CHASER_SPEED;
      }
      chaserSpeechTimer--;
      if (chaserSpeechTimer === 240) {
        chaserSpeech = CHASER_MSGS[Math.floor(Math.random() * CHASER_MSGS.length)];
      }
      if (chaserSpeechTimer <= 120) chaserSpeech = "";
      if (chaserSpeechTimer <= 0) chaserSpeechTimer = 300 + Math.floor(Math.random() * 120);
    }
    if (p.invincible <= 0 && starTimer <= 0 && aabb(p, chaser)) {
      playerHit();
    }
  }

  // ─ 云朵与火球更新
  for (const cl of clouds) {
    const dist = cl.x - cameraX;
    if (dist > W + 200 || dist < -200) continue;
    // 左右摆动
    cl.angle += cl.speed;
    cl.x = cl.baseX + Math.sin(cl.angle) * cl.range;
    cl.timer--;
    if (cl.timer <= 0) {
      cl.timer = 100 + Math.random() * 80;
      fireballs.push({ x: cl.x + 20, y: cl.y + 24, w: 12, h: 12, vy: 1.0, vx: (Math.random() - 0.5) * 1.0 });
    }
  }
  for (let i = fireballs.length - 1; i >= 0; i--) {
    const fb = fireballs[i];
    fb.vy += GRAVITY * 0.5;
    if (fb.vy > 6) fb.vy = 6;
    fb.x += fb.vx;
    fb.y += fb.vy;
    // 出屏幕销毁
    if (fb.y > H + 50) { fireballs.splice(i, 1); continue; }
    // 碰地图销毁
    {
      const row = Math.floor((fb.y + fb.h) / TILE);
      const col = Math.floor((fb.x + fb.w / 2) / TILE);
      if (row >= 0 && row < ROWS && solid(row, col)) {
        // 爆炸粒子
        for (let j = 0; j < 3; j++) {
          particles.push({ x: fb.x, y: fb.y, vx: (Math.random() - 0.5) * 3, vy: -2 - Math.random() * 2, life: 15, type: "debris" });
        }
        fireballs.splice(i, 1);
        continue;
      }
    }
    // 碰玩家
    if (aabb(p, fb)) {
      if (starTimer > 0) {
        fireballs.splice(i, 1);
        addScore(50);
      } else if (p.invincible <= 0) {
        fireballs.splice(i, 1);
        playerHit();
      }
    }
  }

  // ─ 道具更新
  for (const it of items) {
    it.vy += GRAVITY;
    if (it.vy > MAX_FALL) it.vy = MAX_FALL;
    it.x += it.vx;
    // 水平碰撞：碰墙反转方向
    {
      const top = Math.floor(it.y / TILE);
      const bot = Math.floor((it.y + it.h - 1) / TILE);
      if (it.vx > 0) {
        const c = Math.floor((it.x + it.w) / TILE);
        for (let r = top; r <= bot; r++) { if (solid(r, c)) { it.x = c * TILE - it.w; it.vx *= -1; break; } }
      } else if (it.vx < 0) {
        const c = Math.floor(it.x / TILE);
        for (let r = top; r <= bot; r++) { if (solid(r, c)) { it.x = (c + 1) * TILE; it.vx *= -1; break; } }
      }
    }
    it.y += it.vy;
    collideMapY(it, false);
    // 毒蘑菇落地分裂成3个
    if (it.poison && it.onGround && !it.split) {
      it.split = true;
      it.dead = true;
      const speeds = [-1.2, 0.9, 1.5];
      for (let i = 0; i < 3; i++) {
        const m = { x: it.x + (i - 1) * 16, y: it.y - 2, w: 28, h: 28, vx: speeds[i], vy: -4, type: "mushroom", onGround: false, bob: 0, poison: true, name: "李晨珍", split: true };
        items.push(m);
      }
      particles.push({ x: it.x + 10, y: it.y - 10, text: "SPLIT!", life: 30, type: "text" });
      SFX.fuse();
      continue;
    }
    // 蘑菇走出地图
    if (it.y > H + 100) { it.dead = true; continue; }
    // 玩家拾取
    if (aabb(p, it)) {
      if (it.type === "mushroom") {
        if (it.poison) {
          if (!creativeMode) playerDie();
        } else {
          if (!p.big) { p.big = true; p.h = 52; p.y -= 20; }
          addScore(1000);
          SFX.mushroom();
          particles.push({ x: it.x, y: it.y - 10, text: "1000", life: 40, type: "text" });
        }
      } else if (it.type === "star") {
        starTimer = STAR_DURATION;
        addScore(2000);
        SFX.mushroom();
        particles.push({ x: it.x, y: it.y - 10, text: "★INVINCIBLE!", life: 50, type: "text" });
      }
      it.dead = true;
    }
  }
  items = items.filter(it => !it.dead);

  // ─ 金币动画
  for (const ca of coinAnims) { ca.y += ca.vy; ca.vy += 0.5; ca.timer--; }
  coinAnims = coinAnims.filter(ca => ca.timer > 0);

  // ─ 方块弹跳
  for (const bb of bumpBlocks) { bb.offset += 2; }
  bumpBlocks = bumpBlocks.filter(bb => bb.offset < 0);

  // ─ 粒子
  for (const pt of particles) {
    if (pt.type === "debris") { pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.4; }
    pt.life--;
  }
  particles = particles.filter(pt => pt.life > 0);
}

function playerHit() {
  if (player.invincible > 0) return;
  SFX.hit();
  if (player.big) {
    player.big = false;
    player.h = 32;
    player.invincible = 90;
  } else {
    playerDie();
  }
}

  player.dead = true;
  SFX.die();
  player.vy = -10;
  levelTime = Date.now() - levelStartTime; // 记录当前用时
  gameState = "dead";
  deathTimer = 90;
}

async function submitLevelScore(lvlIdx, attemptsUsed, timeSeconds) {
  if (!sb || !playerSession) return;
  const lvlId = lvlIdx + 1;
  const { data: existing } = await sb.from('scores').select('time_seconds').eq('player_id', playerSession.player_id).eq('level_id', lvlId).single();
  // 如果已有记录且时间更短，不更新
  if (existing && existing.time_seconds > 0 && existing.time_seconds <= timeSeconds) return;
  if (existing) {
    await sb.from('scores').update({ attempts: attemptsUsed, time_seconds: timeSeconds, updated_at: new Date().toISOString() }).eq('player_id', playerSession.player_id).eq('level_id', lvlId);
  } else {
    await sb.from('scores').insert({ player_id: playerSession.player_id, level_id: lvlId, attempts: attemptsUsed, time_seconds: timeSeconds });
  }
}

// 已登录则启动心跳并同步attempts
if (playerSession) {
  startHeartbeat();
  // 从数据库加载最新attempts
  if (sb) {
    sb.from('players').select('total_attempts').eq('player_id', playerSession.player_id).single()
      .then(r => {
        if (r.data && r.data.total_attempts !== undefined && r.data.total_attempts !== null) {
          attempts = r.data.total_attempts;
          attemptEl.textContent = "ATTEMPTS: " + attempts;
          saveData();
        }
      });
  }
}

// 首次打开且未注册时，自动显示注册界面
if (!playerSession) {
  menuScreen = "register";
  regField = 0;
  regIdText = "";
  regNameText = "";
  document.getElementById("regIdInput").focus();
}

const COL_GOOMBA_B = "#c07000";
const COL_GOOMBA_S = "#f0c080";
const COL_MUSHROOM = "#e03020";
const COL_MUSHROOM2= "#f8f8f8";
const COL_FLAGPOLE = "#888";
const COL_FLAG     = "#20a020";
const COL_COIN     = "#f8d830";
const COL_DEBRIS   = "#c84c0c";

function draw() {
  ctx.fillStyle = skyColor;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-Math.round(cameraX), 0);

  const startCol = Math.max(0, Math.floor(cameraX / TILE) - 1);
  const endCol   = Math.min(COLS, Math.ceil((cameraX + W) / TILE) + 1);

  // ─ 地图瓦片 ──────────────────────────────────────────────
  for (let r = 0; r < ROWS; r++) {
    for (let c = startCol; c < endCol; c++) {
      const t = LEVEL[r][c];
      const x = c * TILE, y = r * TILE;
      if (t === 1) { // 地面
        ctx.fillStyle = COL_GROUND;
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = COL_GROUND2;
        ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
        // 砖缝
        ctx.fillStyle = COL_GROUND;
        ctx.fillRect(x + TILE/2 - 1, y, 2, TILE);
        ctx.fillRect(x, y + TILE/2 - 1, TILE, 2);
      } else if (t === 2) { // 砖块
        let oy = 0;
        for (const bb of bumpBlocks) { if (bb.row === r && bb.col === c) { oy = bb.offset; break; } }
        ctx.fillStyle = COL_BRICK;
        ctx.fillRect(x, y + oy, TILE, TILE);
        ctx.fillStyle = COL_BRICK2;
        ctx.fillRect(x + 1, y + oy + 1, TILE - 2, TILE - 2);
        ctx.fillStyle = COL_BRICK;
        ctx.fillRect(x + 3, y + oy + 3, TILE - 6, TILE - 6);
        // 砖缝
        ctx.fillStyle = COL_GROUND2;
        ctx.fillRect(x + TILE/2 - 1, y + oy, 2, TILE);
        ctx.fillRect(x, y + oy + TILE/2 - 1, TILE, 2);
      } else if (t === 3 || t === 4 || t === 8) { // 问号
        let oy = 0;
        for (const bb of bumpBlocks) { if (bb.row === r && bb.col === c) { oy = bb.offset; break; } }
        if (t === 8) {
          // 无敌星问号：金色闪烁
          ctx.fillStyle = "#ffd700";
          ctx.fillRect(x, y + oy, TILE, TILE);
          ctx.fillStyle = "#ffaa00";
          ctx.fillRect(x + 2, y + oy + 2, TILE - 4, TILE - 4);
          ctx.fillStyle = "#ffd700";
          ctx.fillRect(x + 4, y + oy + 4, TILE - 8, TILE - 8);
          ctx.fillStyle = "#fff";
          ctx.font = "bold 18px monospace";
          ctx.textAlign = "center";
          ctx.fillText("★", x + TILE/2, y + oy + 24);
        } else {
          ctx.fillStyle = COL_QBLOCK;
          ctx.fillRect(x, y + oy, TILE, TILE);
          ctx.fillStyle = COL_QBLOCK2;
          ctx.fillRect(x + 2, y + oy + 2, TILE - 4, TILE - 4);
          ctx.fillStyle = COL_QBLOCK;
          ctx.fillRect(x + 4, y + oy + 4, TILE - 8, TILE - 8);
          ctx.fillStyle = "#fff";
          ctx.font = "bold 20px monospace";
          ctx.textAlign = "center";
          ctx.fillText("?", x + TILE/2, y + oy + 24);
        }
      } else if (t === 5) { // 管道身
        ctx.fillStyle = COL_PIPE;
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = COL_PIPE2;
        ctx.fillRect(x + 4, y, 4, TILE);
        ctx.fillRect(x + TILE - 8, y, 4, TILE);
      } else if (t === 6) { // 管道顶
        ctx.fillStyle = COL_PIPE;
        ctx.fillRect(x - 2, y, TILE + 4, TILE);
        ctx.fillStyle = COL_PIPE2;
        ctx.fillRect(x + 2, y + 4, TILE - 4, TILE - 4);
        // 高光
        ctx.fillStyle = "#40d040";
        ctx.fillRect(x + 4, y + 2, 6, TILE - 4);
      } else if (t === 9) { // 云块
        ctx.fillStyle = "#f0f8ff";
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = "#e0f0ff";
        ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
        // 云朵纹理
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(x + 8, y + 10, 6, 0, Math.PI * 2);
        ctx.arc(x + 18, y + 8, 7, 0, Math.PI * 2);
        ctx.arc(x + 26, y + 12, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ─ 隐形墙提示（未解锁时显示半透明屏障）
  if (!firstQHit) {
    const wx = WALL_COL * TILE;
    ctx.fillStyle = "rgba(255, 80, 80, 0.15)";
    ctx.fillRect(wx, 0, TILE, H);
    // 闪烁警告条纹
    const phase = Math.floor(Date.now() / 200) % 4;
    ctx.fillStyle = "rgba(255, 255, 0, 0.25)";
    for (let i = phase; i < ROWS; i += 4) {
      ctx.fillRect(wx, i * TILE, TILE, TILE);
    }
    // 文字提示
    ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.fillText("?", wx + TILE / 2, 6 * TILE + 16);
  }

  // ─ 旗杆 ──────────────────────────────────────────────────
  ctx.fillStyle = COL_FLAGPOLE;
  ctx.fillRect(FLAG_X + 14, FLAG_TOP, 4, FLAG_BOTTOM - FLAG_TOP);
  // 旗杆顶球
  ctx.fillStyle = "#40c040";
  ctx.beginPath();
  ctx.arc(FLAG_X + 16, FLAG_TOP, 6, 0, Math.PI * 2);
  ctx.fill();
  // 旗帜（天空关彩虹色）
  if (levelIndex === 1) {
    const rainbow = ["#e03020","#f0a020","#f0e020","#30c030","#3080d0","#6030a0"];
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = rainbow[i];
      ctx.fillRect(FLAG_X + 18, FLAG_TOP + 8 + i * 3, 28, 3);
    }
  } else {
    ctx.fillStyle = COL_FLAG;
    ctx.fillRect(FLAG_X + 18, FLAG_TOP + 8, 28, 20);
  }
  ctx.fillStyle = "#188018";
  ctx.fillRect(FLAG_X + 18, FLAG_TOP + 8, 28, 3);
  ctx.fillRect(FLAG_X + 18, FLAG_TOP + 25, 28, 3);

  // ─ 敌人 ──────────────────────────────────────────────────
  for (const e of enemies) {
    if (e.squishTimer > 0 && !e.alive) {
      // 被踩扁
      ctx.fillStyle = e.big ? "#603000" : COL_GOOMBA_B;
      ctx.fillRect(e.x, e.y + e.h - 8, e.w, 8);
      continue;
    }
    if (!e.alive) continue;
    const bw = e.big ? 1.0 : 0; // 大型偏移
    // 身体
    ctx.fillStyle = e.big ? "#804000" : COL_GOOMBA_B;
    ctx.fillRect(e.x + 2, e.y + 4, e.w - 4, e.h - 8);
    // 头
    ctx.fillStyle = e.big ? "#c09050" : COL_GOOMBA_S;
    ctx.beginPath();
    ctx.arc(e.x + e.w/2, e.y + (e.big ? 14 : 8), e.big ? 22 : 12, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(e.x + 2, e.y + 4, e.w - 4, e.big ? 14 : 8);
    // 眼睛（怒目）
    ctx.fillStyle = "#000";
    if (e.big) {
      ctx.fillRect(e.x + 12, e.y + 10, 8, 7);
      ctx.fillRect(e.x + 36, e.y + 10, 8, 7);
      // 怒眉
      ctx.fillRect(e.x + 10, e.y + 8, 10, 3);
      ctx.fillRect(e.x + 34, e.y + 8, 10, 3);
    } else {
      ctx.fillRect(e.x + 8, e.y + 6, 4, 5);
      ctx.fillRect(e.x + 16, e.y + 6, 4, 5);
    }
    // 脚
    ctx.fillStyle = "#000";
    if (e.big) {
      ctx.fillRect(e.x + 6, e.y + e.h - 10, 16, 10);
      ctx.fillRect(e.x + 34, e.y + e.h - 10, 16, 10);
    } else {
      ctx.fillRect(e.x + 4, e.y + e.h - 6, 8, 6);
      ctx.fillRect(e.x + 16, e.y + e.h - 6, 8, 6);
    }
    // 名字
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.font = e.big ? "bold 12px monospace" : "bold 9px monospace";
    ctx.textAlign = "center";
    const nx = e.x + e.w / 2, ny = e.y - 4;
    ctx.strokeText("老村长", nx, ny);
    ctx.fillText("老村长", nx, ny);
  }

  // ─ 追逐者：巧乐兹 ──────────────────────────────────────────
  if (chaser) {
    const cx = Math.round(chaser.x), cy = Math.round(chaser.y);
    const d = chaser.dir;
    ctx.save();
    if (d === -1) { ctx.translate(cx + chaser.w, 0); ctx.scale(-1, 1); }
    const ox = d === -1 ? 0 : cx;
    // ── 雪碧瓶完整造型 ──
    // 瓶盖（白色）
    ctx.fillStyle = "#e8e8e8";
    ctx.fillRect(ox + 10, cy - 4, 8, 4);
    ctx.fillStyle = "#ccc";
    ctx.fillRect(ox + 10, cy - 2, 8, 2);
    // 瓶颈上段（窄）
    ctx.fillStyle = "#00c860";
    ctx.fillRect(ox + 10, cy, 8, 6);
    // 瓶肩（渐宽）
    ctx.fillStyle = "#00b855";
    ctx.fillRect(ox + 7, cy + 6, 14, 4);
    // 瓶身主体（宽）
    ctx.fillStyle = "#00a850";
    ctx.fillRect(ox + 4, cy + 10, 20, 16);
    // 瓶身高光
    ctx.fillStyle = "rgba(255,255,255,0.2)";
    ctx.fillRect(ox + 6, cy + 10, 4, 16);
    // 雪碧标签（浅绿底+白色）
    ctx.fillStyle = "#80ffa0";
    ctx.fillRect(ox + 4, cy + 13, 20, 10);
    ctx.fillStyle = "#e0ffe8";
    ctx.fillRect(ox + 6, cy + 15, 16, 6);
    // 标签上"Sprite"字样
    ctx.fillStyle = "#008040";
    ctx.font = "bold 7px monospace";
    ctx.textAlign = "center";
    ctx.fillText("SPRITE", ox + 14, cy + 21);
    // 瓶底
    ctx.fillStyle = "#009845";
    ctx.fillRect(ox + 4, cy + 26, 20, 3);
    // ── 邪恶眼睛（在瓶身上） ──
    ctx.fillStyle = "#fff";
    ctx.fillRect(ox + 8, cy + 10, 5, 4);
    ctx.fillRect(ox + 16, cy + 10, 5, 4);
    // 红瞳
    ctx.fillStyle = "#d00";
    ctx.fillRect(ox + 10, cy + 11, 2, 2);
    ctx.fillRect(ox + 18, cy + 11, 2, 2);
    // 怒眉
    ctx.fillStyle = "#006030";
    ctx.fillRect(ox + 7, cy + 9, 6, 2);
    ctx.fillRect(ox + 16, cy + 9, 6, 2);
    // ── 腿（从瓶底伸出） ──
    const legOff = Math.floor(Date.now() / 80) % 2 === 0 ? 3 : -3;
    ctx.fillStyle = "#006830";
    ctx.fillRect(ox + 6, cy + 29 + legOff, 6, 10);
    ctx.fillRect(ox + 16, cy + 29 - legOff, 6, 10);
    // 脚
    ctx.fillStyle = "#004820";
    ctx.fillRect(ox + 3, cy + 39 + legOff, 10, 5);
    ctx.fillRect(ox + 14, cy + 39 - legOff, 10, 5);
    ctx.restore();
    // 名字
    ctx.fillStyle = "#00ff80";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.font = "bold 10px monospace";
    ctx.textAlign = "center";
    const nx = cx + chaser.w / 2;
    ctx.strokeText("巧乐兹", nx, cy - 10);
    ctx.fillText("巧乐兹", nx, cy - 10);
    // 对话气泡
    if (chaserSpeech) {
      ctx.font = "bold 11px monospace";
      const tw = ctx.measureText(chaserSpeech).width + 14;
      const bx = nx - tw / 2, by = cy - 48;
      // 气泡背景
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.fillRect(bx, by, tw, 20);
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, tw, 20);
      // 小尾巴
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.beginPath();
      ctx.moveTo(nx - 4, by + 20);
      ctx.lineTo(nx + 4, by + 20);
      ctx.lineTo(nx, by + 25);
      ctx.closePath();
      ctx.fill();
      // 文字
      ctx.fillStyle = "#c00";
      ctx.textAlign = "center";
      ctx.fillText(chaserSpeech, nx, by + 14);
    }
  }

  // ─ 云朵 ──────────────────────────────────────────────────
  for (const cl of clouds) {
    const dist = cl.x - cameraX;
    if (dist > W + 100 || dist < -100) continue;
    const cx = cl.x, cy = cl.y;
    // 云朵主体（白色圆润）
    ctx.fillStyle = "#f0f0f0";
    ctx.beginPath();
    ctx.arc(cx + 16, cy + 12, 16, 0, Math.PI * 2);
    ctx.arc(cx + 38, cy + 10, 14, 0, Math.PI * 2);
    ctx.arc(cx + 54, cy + 14, 12, 0, Math.PI * 2);
    ctx.arc(cx + 28, cy + 6, 12, 0, Math.PI * 2);
    ctx.fill();
    // 云朵阴影
    ctx.fillStyle = "#d8d8d8";
    ctx.beginPath();
    ctx.arc(cx + 16, cy + 16, 14, 0, Math.PI * 2);
    ctx.arc(cx + 38, cy + 14, 12, 0, Math.PI * 2);
    ctx.fill();
    // 名字
    ctx.fillStyle = "#666";
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.strokeText("羊粪蛋", cx + 32, cy - 2);
    ctx.fillText("羊粪蛋", cx + 32, cy - 2);
  }

  // ─ 火球 ──────────────────────────────────────────────────
  for (const fb of fireballs) {
    // 火球外焰
    ctx.fillStyle = "#ff4400";
    ctx.beginPath();
    ctx.arc(fb.x + 6, fb.y + 6, 7, 0, Math.PI * 2);
    ctx.fill();
    // 火球内焰
    ctx.fillStyle = "#ffaa00";
    ctx.beginPath();
    ctx.arc(fb.x + 6, fb.y + 5, 4, 0, Math.PI * 2);
    ctx.fill();
    // 火球核心
    ctx.fillStyle = "#ffe060";
    ctx.beginPath();
    ctx.arc(fb.x + 6, fb.y + 4, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // ─ 食人花 ──────────────────────────────────────────────────
  for (const pl of plants) {
    if (pl.state === "hide") continue;
    const px = pl.x, py = Math.round(pl.y);
    // 茎（红绿条纹）
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = i % 2 === 0 ? "#30a030" : "#e03020";
      ctx.fillRect(px + 4, py + 8 + i * 7, 20, 7);
    }
    // 头部
    ctx.fillStyle = "#30a030";
    ctx.fillRect(px, py, 28, 12);
    ctx.fillStyle = "#e03020";
    ctx.fillRect(px + 2, py + 2, 24, 8);
    // 嘴巴（白色锯齿）
    ctx.fillStyle = "#f8f8f8";
    ctx.fillRect(px + 4, py + 8, 4, 4);
    ctx.fillRect(px + 12, py + 8, 4, 4);
    ctx.fillRect(px + 20, py + 8, 4, 4);
    // 眼睛
    ctx.fillStyle = "#fff";
    ctx.fillRect(px + 6, py + 3, 5, 4);
    ctx.fillRect(px + 17, py + 3, 5, 4);
    ctx.fillStyle = "#000";
    ctx.fillRect(px + 8, py + 4, 2, 2);
    ctx.fillRect(px + 19, py + 4, 2, 2);
  }

  // ─ 道具 ──────────────────────────────────────────────────
  for (const it of items) {
    if (it.type === "mushroom") {
      it.bob = (it.bob || 0) + 0.15;
      const bounce = Math.abs(Math.sin(it.bob)) * 3;
      const my = it.y - bounce;
      // 毒蘑菇用绿色，正常蘑菇用红色
      const capColor = it.poison ? "#30a030" : COL_MUSHROOM;
      const spotColor = it.poison ? "#90e050" : COL_MUSHROOM2;
      // 蘑菇帽
      ctx.fillStyle = capColor;
      ctx.beginPath();
      ctx.arc(it.x + it.w/2, my + 10, 14, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(it.x, my + 10, it.w, 6);
      // 斑点
      ctx.fillStyle = spotColor;
      ctx.beginPath();
      ctx.arc(it.x + 8, my + 6, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(it.x + 20, my + 6, 4, 0, Math.PI * 2);
      ctx.fill();
      // 蘑菇茎
      ctx.fillStyle = COL_MUSHROOM2;
      ctx.fillRect(it.x + 6, my + 16, 16, 12);
      // 毒蘑菇骷髅标记 + 名字
      if (it.poison) {
        ctx.fillStyle = "#000";
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.fillText("☠", it.x + it.w/2, my + 22);
        // 名字显示在蘑菇头上方
        if (it.name) {
          ctx.fillStyle = "#fff";
          ctx.strokeStyle = "#000";
          ctx.lineWidth = 2;
          ctx.font = "bold 11px monospace";
          ctx.textAlign = "center";
          const nx = it.x + it.w / 2, ny = my - 8;
          ctx.strokeText(it.name, nx, ny);
          ctx.fillText(it.name, nx, ny);
        }
      } else if (it.type === "star") {
        // 无敌星：旋转闪烁的五角星
        it.bob = (it.bob || 0) + 0.1;
        const bounce = Math.abs(Math.sin(it.bob * 0.8)) * 4;
        const sy = it.y - bounce;
        const cx = it.x + 12, cy = sy + 12;
        // 光晕
        ctx.fillStyle = "rgba(255, 215, 0, 0.3)";
        ctx.beginPath();
        ctx.arc(cx, cy, 16, 0, Math.PI * 2);
        ctx.fill();
        // 五角星
        const hue = (Date.now() / 10) % 360;
        ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
        ctx.beginPath();
        for (let j = 0; j < 5; j++) {
          const a = (j * 72 - 90) * Math.PI / 180 + it.bob * 0.5;
          const r = 10;
          ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
          const a2 = ((j * 72 + 36) - 90) * Math.PI / 180 + it.bob * 0.5;
          ctx.lineTo(cx + Math.cos(a2) * 4, cy + Math.sin(a2) * 4);
        }
        ctx.closePath();
        ctx.fill();
        // 中心高光
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(cx - 2, cy - 2, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ─ 金币弹出动画 ──────────────────────────────────────────
  for (const ca of coinAnims) {
    ctx.fillStyle = COL_COIN;
    ctx.beginPath();
    ctx.arc(ca.x + 8, ca.y + 8, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#c8a020";
    ctx.beginPath();
    ctx.arc(ca.x + 8, ca.y + 8, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  // ─ 粒子 ──────────────────────────────────────────────────
  for (const pt of particles) {
    if (pt.type === "debris") {
      ctx.fillStyle = COL_DEBRIS;
      ctx.fillRect(pt.x, pt.y, 8, 8);
    } else if (pt.type === "text") {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 14px monospace";
      ctx.textAlign = "center";
      ctx.globalAlpha = Math.min(1, pt.life / 15);
      ctx.fillText(pt.text, pt.x + 14, pt.y + (40 - pt.life) * 0.5);
      ctx.globalAlpha = 1;
    }
  }

  // ─ 玩家 ──────────────────────────────────────────────────
  if (!player.dead || gameState === "dead") {
    drawMario(player);
  }

  ctx.restore();

  // ─ 创造模式指示器 ─
  if (creativeMode && gameState === "playing") {
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(4, 4, 140, 24);
    ctx.fillStyle = "#0f0";
    ctx.font = "bold 14px monospace";
    ctx.textAlign = "left";
    ctx.fillText("⚡ 创造模式" + (flying ? " [飞行中]" : ""), 10, 21);
  }

  // ─ 覆盖层 ────────────────────────────────────────────────
  if (gameState === "deathwait") {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#e03020";
    ctx.font = "bold 48px monospace";
    ctx.textAlign = "center";
    ctx.fillText("YOU DIED", W/2, H/2 - 40);
    ctx.fillStyle = "#fff";
    ctx.font = "22px monospace";
    ctx.fillText("尝试次数: " + attempts, W/2, H/2 + 10);
    ctx.font = "18px monospace";
    ctx.fillText("按 R 重新开始 | ESC 返回菜单", W/2, H/2 + 50);
  }
  if (gameState === "gameover") {
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#e03020";
    ctx.font = "bold 56px monospace";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", W/2, H/2 - 30);
    ctx.fillStyle = "#fff";
    ctx.font = "22px monospace";
    ctx.fillText("SCORE: " + score, W/2, H/2 + 20);
    ctx.font = "18px monospace";
    ctx.fillText("按 R 重新开始 | ESC 返回菜单", W/2, H/2 + 60);
  }
  if (gameState === "win") {
    winTimer--;
    ctx.fillStyle = "rgba(0,0,0," + Math.min(0.7, (180 - winTimer) / 180 * 0.7) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 48px monospace";
    ctx.textAlign = "center";
    ctx.fillText("YOU WIN!", W/2, H/2 - 30);
    ctx.fillStyle = "#fff";
    ctx.font = "20px monospace";
    ctx.fillText("SCORE: " + score, W/2, H/2 + 10);
    ctx.font = "16px monospace";
    const finalTimeStr = ((Date.now() - levelStartTime) / 1000).toFixed(1);
    ctx.fillText("通关时间: " + finalTimeStr + "s | 尝试: " + levelAttempts, W/2, H/2 + 35);
    if (playerSession) {
      ctx.fillStyle = "#2ecc71";
      ctx.font = "13px monospace";
      ctx.fillText("成绩已上传排行榜", W/2, H/2 + 55);
    }
    if (winTimer <= 0) {
      ctx.fillStyle = "#fff";
      ctx.font = "16px monospace";
      ctx.fillText("按 R 重新开始 | ESC 返回菜单", W/2, H/2 + 80);
    }
  }
  // ─ 暂停画面 ─
  if (gameState === "paused") {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 48px monospace";
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", W/2, H/2 - 80);
    // 菜单选项
    const opts = ["▶ 继续游戏", "🏠 返回菜单"];
    for (let i = 0; i < 2; i++) {
      const oy = H/2 - 10 + i * 55;
      const sel = (i === pauseSel);
      ctx.fillStyle = sel ? "rgba(255,215,0,0.15)" : "rgba(255,255,255,0.05)";
      ctx.fillRect(W/2 - 130, oy, 260, 42);
      ctx.strokeStyle = sel ? "#ffd700" : "#555";
      ctx.lineWidth = sel ? 2 : 1;
      ctx.strokeRect(W/2 - 130, oy, 260, 42);
      ctx.fillStyle = sel ? "#ffd700" : "#ccc";
      ctx.font = "bold 18px monospace";
      ctx.fillText(opts[i], W/2, oy + 28);
    }
    ctx.fillStyle = "#888";
    ctx.font = "12px monospace";
    ctx.fillText("↑↓ 选择 | Enter 确认 | ESC 继续", W/2, H/2 + 120);
  }
  if (gameState === "ready") {
    // 背景
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, W, H);
    // 标题
    ctx.fillStyle = "#e03020";
    ctx.font = "bold 44px monospace";
    ctx.textAlign = "center";
    ctx.fillText("SUPER MARIO", W/2, 65);
    ctx.fillStyle = "#fca044";
    ctx.font = "bold 16px monospace";
    ctx.fillText("HTML5 Canvas Edition", W/2, 90);

    // ═══ 主菜单 ═══
    if (menuScreen === "main") {
      const btns = ["🎮 角色选择", "🗺️ 关卡选择", "🏆 排行榜", "⚙️ 设置"];
      const btnY = 130;
      for (let i = 0; i < 4; i++) {
        const by = btnY + i * 52;
        const sel = (i === menuBtn);
        ctx.fillStyle = sel ? "rgba(255,215,0,0.2)" : "rgba(255,255,255,0.05)";
        ctx.fillRect(W/2 - 130, by, 260, 40);
        ctx.strokeStyle = sel ? "#ffd700" : "#666";
        ctx.lineWidth = sel ? 2 : 1;
        ctx.strokeRect(W/2 - 130, by, 260, 40);
        ctx.fillStyle = sel ? "#ffd700" : "#ccc";
        ctx.font = "bold 16px monospace";
        ctx.textAlign = "center";
        ctx.fillText(btns[i], W/2, by + 27);
      }
      // 玩家信息
      if (playerSession) {
        ctx.fillStyle = "#2ecc71";
        ctx.font = "12px monospace";
        ctx.fillText("👤 " + playerSession.player_id + " (" + playerSession.name + ")", W/2, 350);
      } else {
        ctx.fillStyle = "#888";
        ctx.font = "12px monospace";
        ctx.fillText("未注册（按 Tab 注册，成绩可上传排行榜）", W/2, 350);
      }
      // 选中角色预览
      const ch = CHARACTERS[charIndex];
      ctx.fillStyle = ch.hat;
      ctx.fillRect(W/2 - 8, 370, 16, 6);
      ctx.fillStyle = ch.skin;
      ctx.fillRect(W/2 - 8, 376, 16, 8);
      ctx.fillStyle = ch.hat;
      ctx.fillRect(W/2 - 9, 383, 18, 7);
      ctx.fillStyle = ch.overalls;
      ctx.fillRect(W/2 - 7, 388, 14, 8);
      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 12px monospace";
      ctx.fillText(ch.name, W/2, 415);
      // 最高分
      const hs = (loadData().highScore) || 0;
      if (hs > 0) {
        ctx.fillStyle = "#aaa";
        ctx.font = "12px monospace";
        ctx.fillText("最高分: " + hs + "  尝试: " + attempts, W/2, 432);
      }
      // 开始提示
      if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillStyle = "#ffd700";
        ctx.font = "bold 16px monospace";
        ctx.fillText("按 空格 开始游戏", W/2, 455);
      }
    }

    // ═══ 角色选择 ═══
    if (menuScreen === "characters") {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px monospace";
      ctx.textAlign = "center";
      ctx.fillText("选择角色", W/2, 120);
      const charY = 160;
      const spacing = 130;
      const startX = W / 2 - (CHARACTERS.length - 1) * spacing / 2;
      for (let i = 0; i < CHARACTERS.length; i++) {
        const ch = CHARACTERS[i];
        const cx = startX + i * spacing;
        const selected = (i === charIndex);
        if (selected) {
          ctx.strokeStyle = "#ffd700";
          ctx.lineWidth = 3;
          ctx.strokeRect(cx - 34, charY - 6, 68, 68);
          if (Math.floor(Date.now() / 300) % 2 === 0) {
            ctx.fillStyle = "#ffd700";
            ctx.font = "bold 20px monospace";
            ctx.fillText("▼", cx, charY - 12);
          }
        }
        const s = charY + 4;
        if (ch.clown) {
          ctx.fillStyle = "#ff00ff"; ctx.fillRect(cx - 10, s - 1, 20, 5);
          ctx.fillStyle = "#00c8c8"; ctx.fillRect(cx - 7, s + 1, 5, 4); ctx.fillRect(cx + 2, s, 5, 5);
          ctx.fillStyle = "#ff6600"; ctx.fillRect(cx - 3, s + 2, 6, 3);
          ctx.fillStyle = "#f8f8f8"; ctx.fillRect(cx - 8, s + 5, 16, 8);
          ctx.fillStyle = "#e03020"; ctx.beginPath(); ctx.arc(cx, s + 10, 2.5, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = "#00c8c8"; ctx.fillRect(cx - 5, s + 7, 3, 2); ctx.fillRect(cx + 2, s + 7, 3, 2);
          ctx.fillStyle = "#e03020"; ctx.fillRect(cx - 4, s + 12, 8, 2);
          ctx.fillStyle = "#00c8c8"; ctx.fillRect(cx - 9, s + 15, 18, 6);
          ctx.fillStyle = "#ff6600"; ctx.fillRect(cx - 7, s + 19, 14, 6);
          ctx.fillStyle = "#ff00ff"; ctx.fillRect(cx - 10, s + 25, 8, 4); ctx.fillRect(cx + 2, s + 25, 8, 4);
        } else {
          ctx.fillStyle = ch.hat; ctx.fillRect(cx - 8, s, 16, 5); ctx.fillRect(cx - 10, s + 2, 20, 4);
          ctx.fillStyle = ch.skin; ctx.fillRect(cx - 8, s + 6, 16, 7);
          ctx.fillStyle = "#000"; ctx.fillRect(cx + 3, s + 7, 2, 2);
          ctx.fillStyle = ch.hat; ctx.fillRect(cx - 9, s + 12, 18, 6);
          ctx.fillStyle = ch.overalls; ctx.fillRect(cx - 7, s + 16, 14, 7);
          ctx.fillStyle = ch.shoe; ctx.fillRect(cx - 8, s + 23, 6, 4); ctx.fillRect(cx + 2, s + 23, 6, 4);
          if (i === 3) { ctx.fillStyle = "#e03020"; ctx.beginPath(); ctx.arc(cx, s + 3, 3, 0, Math.PI*2); ctx.fill(); }
        }
        ctx.fillStyle = selected ? "#ffd700" : "#ccc";
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        const dn = (i === 4) ? (customName || "小丑") : ch.name;
        ctx.fillText(dn, cx, charY + 60);
      }
      // 名字输入
      if (charIndex === 4) {
        if (nameInputMode) {
          ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(W/2 - 150, 250, 300, 75);
          ctx.strokeStyle = "#ffd700"; ctx.lineWidth = 2; ctx.strokeRect(W/2 - 150, 250, 300, 75);
          ctx.fillStyle = "#ffd700"; ctx.font = "bold 15px monospace"; ctx.fillText("输入名字（最多6字）", W/2, 272);
          ctx.fillStyle = "#222"; ctx.fillRect(W/2 - 75, 282, 150, 26);
          ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.strokeRect(W/2 - 75, 282, 150, 26);
          ctx.fillStyle = "#fff"; ctx.font = "bold 16px monospace";
          const cur = Math.floor(Date.now()/400)%2===0 ? "|" : "";
          ctx.fillText((customName||"")+cur, W/2, 300);
          ctx.fillStyle = "#aaa"; ctx.font = "11px monospace"; ctx.fillText("回车确认 | ESC取消", W/2, 320);
        } else {
          const bk = Math.floor(Date.now()/400)%2===0;
          ctx.fillStyle = bk ? "#ffd700" : "#ff8c00";
          ctx.font = "bold 13px monospace";
          ctx.fillText("⏎ 回车自定义名字", W/2, charY + 75);
        }
      }
      ctx.fillStyle = "#888"; ctx.font = "12px monospace";
      ctx.fillText("ESC 返回", W/2, 440);
    }

    // ═══ 关卡选择 ═══
    if (menuScreen === "levels") {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px monospace";
      ctx.textAlign = "center";
      ctx.fillText("关卡选择", W/2, 140);
      for (let i = 0; i < LEVELS.length; i++) {
        const ly = 190 + i * 55;
        const sel = (i === levelIndex);
        ctx.fillStyle = sel ? "rgba(255,215,0,0.15)" : "rgba(255,255,255,0.05)";
        ctx.fillRect(W/2 - 180, ly, 360, 42);
        ctx.strokeStyle = sel ? "#ffd700" : "#555";
        ctx.lineWidth = sel ? 2 : 1;
        ctx.strokeRect(W/2 - 180, ly, 360, 42);
        ctx.fillStyle = sel ? "#ffd700" : "#ccc";
        ctx.font = "bold 16px monospace";
        ctx.textAlign = "center";
        ctx.fillText("第" + (i + 1) + "关 - " + LEVELS[i].name, W/2, ly + 20);
        ctx.fillStyle = "#999";
        ctx.font = "11px monospace";
        ctx.fillText(LEVELS[i].desc, W/2, ly + 36);
      }
      ctx.fillStyle = "#888"; ctx.font = "12px monospace";
      ctx.fillText("↑↓ 选择  |  ESC 返回", W/2, 440);
    }

    // ═══ 设置 ═══
    if (menuScreen === "settings") {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 20px monospace";
      ctx.textAlign = "center";
      ctx.fillText("设置", W/2, 140);
      const items = [
        { name: "亮度", val: settings.brightness, min: 0.3, max: 1.0, unit: "%" },
        { name: "音量", val: settings.volume, min: 0, max: 1.0, unit: "%" },
        { name: "移速", val: settings.speed, min: 0.5, max: 1.5, unit: "x" },
      ];
      for (let i = 0; i < 3; i++) {
        const sy = 190 + i * 65;
        const sel = (i === settingsSel);
        ctx.fillStyle = sel ? "rgba(255,215,0,0.1)" : "rgba(255,255,255,0.03)";
        ctx.fillRect(W/2 - 180, sy, 360, 50);
        ctx.strokeStyle = sel ? "#ffd700" : "#444";
        ctx.lineWidth = sel ? 2 : 1;
        ctx.strokeRect(W/2 - 180, sy, 360, 50);
        // 名称
        ctx.fillStyle = sel ? "#ffd700" : "#ccc";
        ctx.font = "bold 15px monospace";
        ctx.textAlign = "left";
        ctx.fillText(items[i].name, W/2 - 160, sy + 22);
        // 滑块背景
        ctx.fillStyle = "#333";
        ctx.fillRect(W/2 - 40, sy + 16, 180, 10);
        // 滑块填充
        const pct = (items[i].val - items[i].min) / (items[i].max - items[i].min);
        ctx.fillStyle = sel ? "#ffd700" : "#888";
        ctx.fillRect(W/2 - 40, sy + 16, 180 * pct, 10);
        // 滑块手柄
        ctx.fillStyle = "#fff";
        ctx.fillRect(W/2 - 40 + 180 * pct - 3, sy + 13, 6, 16);
        // 数值
        ctx.fillStyle = "#fff";
        ctx.font = "bold 13px monospace";
        ctx.textAlign = "right";
        const dispVal = items[i].unit === "%" ? Math.round(items[i].val * 100) + "%" : items[i].val.toFixed(1) + "x";
        ctx.fillText(dispVal, W/2 + 160, sy + 22);
        // 左右箭头提示
        if (sel) {
          ctx.fillStyle = "#ffd700";
          ctx.font = "bold 16px monospace";
          ctx.textAlign = "center";
          ctx.fillText("◀", W/2 - 55, sy + 23);
          ctx.fillText("▶", W/2 + 175, sy + 23);
        }
      }
      ctx.fillStyle = "#888"; ctx.font = "12px monospace";
      ctx.textAlign = "center";
      ctx.fillText("↑↓ 选择  |  ←→ 调节  |  ESC 返回", W/2, 440);
    }

    // ═══ 注册界面 ═══
    if (menuScreen === "register") {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 22px monospace";
      ctx.textAlign = "center";
      ctx.fillText("👤 玩家注册", W/2, 130);
      ctx.fillStyle = "#aaa";
      ctx.font = "12px monospace";
      ctx.fillText("注册后成绩将上传排行榜", W/2, 155);

      // ID 输入框
      const idSel = (regField === 0);
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      ctx.fillRect(W/2 - 160, 180, 320, 44);
      ctx.strokeStyle = idSel ? "#ffd700" : "#555";
      ctx.lineWidth = idSel ? 2 : 1;
      ctx.strokeRect(W/2 - 160, 180, 320, 44);
      ctx.fillStyle = "#888"; ctx.font = "12px monospace"; ctx.textAlign = "left";
      ctx.fillText("玩家ID", W/2 - 150, 197);
      ctx.fillStyle = "#fff"; ctx.font = "bold 15px monospace";
      const idCur = (idSel && Math.floor(Date.now()/400)%2===0) ? "|" : "";
      ctx.fillText((regIdText || "") + idCur, W/2 - 150, 216);

      // 姓名输入框
      const nameSel = (regField === 1);
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      ctx.fillRect(W/2 - 160, 240, 320, 44);
      ctx.strokeStyle = nameSel ? "#ffd700" : "#555";
      ctx.lineWidth = nameSel ? 2 : 1;
      ctx.strokeRect(W/2 - 160, 240, 320, 44);
      ctx.fillStyle = "#888"; ctx.font = "12px monospace"; ctx.textAlign = "left";
      ctx.fillText("姓名", W/2 - 150, 257);
      ctx.fillStyle = "#fff"; ctx.font = "bold 15px monospace";
      const nameCur = (nameSel && Math.floor(Date.now()/400)%2===0) ? "|" : "";
      ctx.fillText((regNameText || "") + nameCur, W/2 - 150, 276);

      // 提示
      ctx.fillStyle = "#888"; ctx.font = "12px monospace"; ctx.textAlign = "center";
      if (regField === 0) ctx.fillText("输入ID后按 Enter 继续", W/2, 310);
      else ctx.fillText("输入姓名后按 Enter 注册", W/2, 310);

      // 消息
      if (regMsgTimer > 0 && regMsg) {
        ctx.fillStyle = regMsg.includes("成功") ? "#2ecc71" : "#e74c3c";
        ctx.font = "bold 14px monospace";
        ctx.fillText(regMsg, W/2, 340);
      }

      ctx.fillStyle = "#666"; ctx.font = "12px monospace";
      ctx.fillText("ESC 跳过（不注册直接玩）", W/2, 440);
    }

    // ═══ 排行榜界面 ═══
    if (menuScreen === "leaderboard") {
      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 22px monospace";
      ctx.textAlign = "center";
      ctx.fillText("🏆 排行榜", W/2, 120);

      // 关卡 Tab
      for (let i = 0; i < LEVELS.length; i++) {
        const tx = W/2 - (LEVELS.length * 90) / 2 + i * 90 + 45;
        const sel = (i === lbTab);
        ctx.fillStyle = sel ? "#ffd700" : "#888";
        ctx.font = (sel ? "bold " : "") + "14px monospace";
        ctx.fillText("第" + (i+1) + "关", tx, 150);
        if (sel) {
          ctx.fillStyle = "#ffd700";
          ctx.fillRect(tx - 25, 155, 50, 2);
        }
      }

      // 表头
      ctx.fillStyle = "#888";
      ctx.font = "12px monospace";
      ctx.textAlign = "left";
      ctx.fillText("排名", W/2 - 170, 180);
      ctx.fillText("玩家ID", W/2 - 100, 180);
      ctx.textAlign = "right";
      ctx.fillText("通关时间", W/2 + 170, 180);
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(W/2 - 175, 188); ctx.lineTo(W/2 + 175, 188); ctx.stroke();

      // 数据
      if (lbLoading) {
        ctx.fillStyle = "#888"; ctx.font = "14px monospace"; ctx.textAlign = "center";
        ctx.fillText("加载中...", W/2, 250);
      } else if (lbData.length === 0) {
        ctx.fillStyle = "#666"; ctx.font = "14px monospace"; ctx.textAlign = "center";
        ctx.fillText("暂无记录", W/2, 250);
      } else {
        for (let i = 0; i < lbData.length; i++) {
          const row = lbData[i];
          const ry = 205 + i * 28;
          if (ry > 420) break;
          const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i+1)+".";
          const isMe = playerSession && row.player_id === playerSession.player_id;
          ctx.fillStyle = isMe ? "rgba(255,215,0,0.1)" : "transparent";
          ctx.fillRect(W/2 - 175, ry - 12, 350, 24);
          ctx.fillStyle = i < 3 ? "#ffd700" : (isMe ? "#ffd700" : "#ccc");
          ctx.font = (isMe ? "bold " : "") + "13px monospace";
          ctx.textAlign = "left";
          ctx.fillText(medal, W/2 - 170, ry);
          ctx.fillText(row.player_id, W/2 - 100, ry);
          ctx.textAlign = "right";
          const timeStr = row.time_seconds > 0 ? row.time_seconds.toFixed(1) + "s" : "--";
          ctx.fillText(timeStr, W/2 + 170, ry);
        }
      }

      ctx.fillStyle = "#888"; ctx.font = "12px monospace"; ctx.textAlign = "center";
      ctx.fillText("←→ 切换关卡  |  ESC 返回", W/2, 450);
    }
  }

  // ─ 亮度调节遮罩 ─
  if (settings.brightness < 1.0) {
    ctx.fillStyle = `rgba(0,0,0,${(1 - settings.brightness).toFixed(2)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ─── 画马里奥 ────────────────────────────────────────────────
function drawMario(p) {
  if (!creativeMode && p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0) return; // 闪烁（创造模式不闪）

  const ch = CHARACTERS[charIndex];
  let cHat = ch.hat, cSkin = ch.skin, cOver = ch.overalls, cShoe = ch.shoe;

  // 无敌星彩虹闪烁
  if (starTimer > 0) {
    const hue = (Date.now() / 8) % 360;
    cHat = `hsl(${hue}, 100%, 55%)`;
    cOver = `hsl(${(hue + 120) % 360}, 100%, 55%)`;
    cShoe = `hsl(${(hue + 240) % 360}, 100%, 45%)`;
  }

  const x = Math.round(p.x), y = Math.round(p.y);
  const d = p.dir;
  ctx.save();
  if (d === -1) { ctx.translate(x + p.w, 0); ctx.scale(-1, 1); ctx.translate(0, 0); }
  const ox = d === -1 ? 0 : x;

  if (p.big) {
    // 大角色 (24x52)
    // 帽子
    ctx.fillStyle = cHat;
    ctx.fillRect(ox + 4, y, 16, 8);
    ctx.fillRect(ox + 2, y + 4, 20, 6);
    // 脸
    ctx.fillStyle = cSkin;
    ctx.fillRect(ox + 4, y + 10, 16, 10);
    // 眼睛
    ctx.fillStyle = "#000";
    ctx.fillRect(ox + 14, y + 12, 3, 4);
    // 小丑红鼻子
    if (ch.clown) {
      ctx.fillStyle = "#e03020";
      ctx.beginPath();
      ctx.arc(ox + 14, y + 16, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    // 胡子
    ctx.fillStyle = "#6b3400";
    ctx.fillRect(ox + 10, y + 18, 10, 3);
    // 身体
    ctx.fillStyle = cHat;
    ctx.fillRect(ox + 2, y + 20, 20, 12);
    // 背带裤
    ctx.fillStyle = cOver;
    ctx.fillRect(ox + 4, y + 28, 16, 14);
    // 背带
    ctx.fillStyle = cHat;
    ctx.fillRect(ox + 6, y + 22, 3, 8);
    ctx.fillRect(ox + 15, y + 22, 3, 8);
    // 裤子高光
    ctx.fillStyle = cOver;
    ctx.globalAlpha = 0.4;
    ctx.fillRect(ox + 6, y + 30, 5, 10);
    ctx.globalAlpha = 1;
    // 鞋子
    ctx.fillStyle = cShoe;
    ctx.fillRect(ox + 2, y + 42, 8, 10);
    ctx.fillRect(ox + 14, y + 42, 8, 10);
    // 走路动画 — 腿
    if (p.onGround && Math.abs(p.vx) > 0.1) {
      if (p.animFrame === 1) {
        ctx.fillStyle = cOver;
        ctx.fillRect(ox + 2, y + 38, 8, 6);
        ctx.fillRect(ox + 14, y + 40, 8, 4);
      }
    }
  } else {
    // 小角色 (24x32)
    // 帽子
    ctx.fillStyle = cHat;
    ctx.fillRect(ox + 4, y, 14, 6);
    ctx.fillRect(ox + 2, y + 3, 18, 5);
    // 脸
    ctx.fillStyle = cSkin;
    ctx.fillRect(ox + 4, y + 8, 14, 8);
    // 眼睛
    ctx.fillStyle = "#000";
    ctx.fillRect(ox + 14, y + 9, 3, 3);
    // 小丑红鼻子
    if (ch.clown) {
      ctx.fillStyle = "#e03020";
      ctx.beginPath();
      ctx.arc(ox + 14, y + 13, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    // 胡子
    ctx.fillStyle = "#6b3400";
    ctx.fillRect(ox + 10, y + 14, 8, 2);
    // 身体
    ctx.fillStyle = cHat;
    ctx.fillRect(ox + 3, y + 15, 18, 7);
    // 背带裤
    ctx.fillStyle = cOver;
    ctx.fillRect(ox + 5, y + 20, 14, 6);
    // 背带
    ctx.fillStyle = cHat;
    ctx.fillRect(ox + 6, y + 16, 2, 5);
    ctx.fillRect(ox + 16, y + 16, 2, 5);
    // 鞋子
    ctx.fillStyle = cShoe;
    ctx.fillRect(ox + 3, y + 26, 7, 6);
    ctx.fillRect(ox + 14, y + 26, 7, 6);
    // 走路
    if (p.onGround && Math.abs(p.vx) > 0.1 && p.animFrame === 1) {
      ctx.fillStyle = cOver;
      ctx.fillRect(ox + 3, y + 24, 7, 4);
      ctx.fillRect(ox + 14, y + 25, 7, 3);
    }
  }
  ctx.restore();

  // ─ 角色名显示在头顶 ─
  const chName = CHARACTERS[charIndex].name;
  if (chName) {
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    const nx = Math.round(p.x) + p.w / 2;
    const ny = Math.round(p.y) - 6;
    ctx.strokeText(chName, nx, ny);
    ctx.fillText(chName, nx, ny);
  }
}

// ─── 游戏循环 ────────────────────────────────────────────────
function loop() {
  // 重新开始
  if ((gameState === "gameover" || gameState === "win") && keys["KeyR"]) {
    levelAttempts = 0;
    init();
    keys["KeyR"] = false;
  }
  // 更新计时显示
  if (gameState === "playing") {
    const elapsed = (Date.now() - levelStartTime) / 1000;
    timerEl.textContent = "TIME: " + elapsed.toFixed(1) + "s";
  }
  update();
  draw();
  requestAnimationFrame(loop);
}

// ─── 启动提示 ────────────────────────────────────────────────
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
